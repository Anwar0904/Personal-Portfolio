<svg xmlns="http://w3.org" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#e0f2fe" />
  
  <!-- Antenna -->
  <line x1="100" y1="50" x2="100" y2="30" stroke="#0284c7" stroke-width="4" stroke-linecap="round" />
  <circle cx="100" cy="24" r="6" fill="#0ea5e9" />

  <!-- Left Arm (At side) -->
  <rect x="40" y="95" width="15" height="35" rx="7" fill="#0284c7" />

  <!-- Right Arm (Waving up) -->
  <g transform="translate(145, 80) rotate(-30)">
    <rect x="0" y="-20" width="15" height="40" rx="7" fill="#0284c7" />
    <circle cx="7.5" cy="-22" r="6" fill="#0ea5e9" />
  </g>

  <!-- Body -->
  <rect x="65" y="80" width="70" height="75" rx="15" fill="#0284c7" />
  <!-- Belly screen -->
  <rect x="75" y="95" width="50" height="45" rx="8" fill="#bae6fd" />
  <circle cx="100" cy="117.5" r="12" fill="#0284c7" />

  <!-- Feet -->
  <rect x="75" y="155" width="16" height="15" rx="5" fill="#0369a1" />
  <rect x="109" y="155" width="16" height="15" rx="5" fill="#0369a1" />

  <!-- Head -->
  <rect x="55" y="45" width="90" height="40" rx="12" fill="#0ea5e9" />
  
  <!-- Eyes -->
  <circle cx="80" cy="62" r="6" fill="#bae6fd" />
  <circle cx="120" cy="62" r="6" fill="#bae6fd" />

  <!-- Smile -->
  <path d="M 90 72 Q 100 80 110 72" fill="none" stroke="#bae6fd" stroke-width="3" stroke-linecap="round" />
</svg>
